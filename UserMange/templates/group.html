{% extends 'template.html' %}

{% block content %}
    <div class="align-items-stretch">
        <h2>Group List</h2>
    </div>
    <div align="right">
        <a class="btn btn-primary" href="add/">Add Group</a>
    </div>

    <div class="form-group">
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Group ID</th>
                    <th>Group Name</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
            {% if not grp_data %}
            <tr>
                <td>1</td>
                <td>Example</td>
            </tr>
            {% endif %}
            {% for g in grp_data %}
            <tr>
                <td>{{ g.id }}</td>
                <td>{{ g.gname }}</td>
            </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>


{% endblock %}
